<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>움짤 페어틀 메이커</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- gifshot (100% 클라이언트 GIF 인코더) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
  <!-- 감성 서체 Pretendard -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    /* 모바일 스크롤바 정리 */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
  </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen pb-12">

  <!-- 미니멀 감성 네비게이션 -->
  <header class="border-b border-zinc-800/80 px-4 py-3 bg-[#09090b]/80 backdrop-blur sticky top-0 z-30 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <span class="text-xs font-semibold tracking-wider text-zinc-400 uppercase">Pair Gif Maker</span>
      <span class="text-[10px] text-zinc-500 border border-zinc-800 px-1.5 py-0.5 rounded">beta</span>
    </div>
    <span class="text-xs text-zinc-500 font-mono">100% client-side</span>
  </header>

  <main class="max-w-xl mx-auto px-4 pt-4 space-y-5">

    <!-- 1. 캔버스 프리뷰 카드 (정방형 3:4 감성 비율) -->
    <div class="relative bg-zinc-950 rounded-2xl p-2 border border-zinc-800 shadow-2xl flex flex-col items-center">
      <canvas id="previewCanvas" width="540" height="700" class="w-full max-w-[320px] aspect-[540/700] rounded-xl bg-black shadow-inner"></canvas>
      
      <div class="w-full px-2 pt-2 flex items-center justify-between text-[11px] text-zinc-500">
        <span class="flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          실시간 미리보기
        </span>
        <span class="text-zinc-600 font-mono">540×700</span>
      </div>
    </div>

    <!-- 2. 다운로드 및 GIF 변환 버튼 -->
    <div class="space-y-2">
      <button id="btnGenerate" class="w-full py-3.5 bg-zinc-100 hover:bg-white text-zinc-950 font-bold rounded-xl text-sm transition-all shadow-md active:scale-[0.99] flex items-center justify-center space-x-2">
        <span id="btnIcon">✨</span>
        <span id="btnText">움짤(GIF) 내보내기</span>
      </button>

      <!-- 인코딩 프로그레스 -->
      <div id="loadingStatus" class="hidden space-y-1.5 py-2">
        <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
          <div id="progressBar" class="bg-indigo-500 h-full w-0 transition-all duration-200"></div>
        </div>
        <p id="statusMsg" class="text-center text-[11px] text-zinc-400 font-mono">프레임 추출 중...</p>
      </div>

      <!-- 완성 결과물 노출 -->
      <div id="resultArea" class="hidden flex flex-col items-center space-y-3 p-3 bg-zinc-900/90 rounded-xl border border-zinc-800">
        <img id="resultGif" class="w-full max-w-[220px] rounded-lg shadow-xl" alt="결과 GIF">
        <div class="flex w-full gap-2">
          <a id="btnDownload" download="pair_aesthetic.gif" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-center font-semibold rounded-lg text-xs transition">
            💾 갤러리에 저장하기
          </a>
          <button id="btnShareX" class="py-2.5 px-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold rounded-lg text-xs transition flex items-center gap-1">
            𝕏 트윗
          </button>
        </div>
      </div>
    </div>

    <!-- 3. 모바일 최적화 탭 컨트롤러 -->
    <div class="bg-zinc-900/80 rounded-2xl border border-zinc-800/80 overflow-hidden">
      <!-- 탭 바 -->
      <div class="grid grid-cols-3 border-b border-zinc-800 text-xs font-medium text-center">
        <button id="tabBtn1" class="tab-btn py-3 border-b-2 border-indigo-500 text-white font-semibold transition" data-tab="tab1">🖼️ 이미지</button>
        <button id="tabBtn2" class="tab-btn py-3 border-b-2 border-transparent text-zinc-400 hover:text-zinc-200 transition" data-tab="tab2">✍️ 대사·텍스트</button>
        <button id="tabBtn3" class="tab-btn py-3 border-b-2 border-transparent text-zinc-400 hover:text-zinc-200 transition" data-tab="tab3">🎨 테마 색상</button>
      </div>

      <div class="p-4 space-y-4">
        
        <!-- [탭 1] 이미지 업로드 -->
        <div id="tab1" class="tab-content space-y-3">
          <div>
            <label class="block text-xs font-medium text-zinc-300 mb-1.5">메인 배경 일러스트</label>
            <input type="file" id="bgInput" accept="image/*" class="w-full text-xs text-zinc-400 file:mr-2.5 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-medium file:bg-zinc-800 file:text-zinc-200 hover:file:bg-zinc-700 cursor-pointer">
          </div>
          <div>
            <label class="block text-xs font-medium text-zinc-300 mb-1.5">아이폰 배경 (선택 / 비우면 메인 이미지 적용)</label>
            <input type="file" id="phoneInput" accept="image/*" class="w-full text-xs text-zinc-400 file:mr-2.5 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-medium file:bg-zinc-800 file:text-zinc-200 hover:file:bg-zinc-700 cursor-pointer">
          </div>
        </div>

        <!-- [탭 2] 텍스트 & 대사 입력 -->
        <div id="tab2" class="tab-content hidden space-y-3">
          <div>
            <label class="text-[11px] text-zinc-400">상단 인용 대사</label>
            <input type="text" id="quoteText" value="오늘도 내 곁에 있어 줄 거죠?" class="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-zinc-500">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] text-zinc-400">잠금화면 시간</label>
              <input type="text" id="phoneTime" value="08:24" class="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-zinc-500">
            </div>
            <div>
              <label class="text-[11px] text-zinc-400">발신자(페어 이름)</label>
              <input type="text" id="senderName" value="마인에이스" class="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-zinc-500">
            </div>
          </div>

          <div>
            <label class="text-[11px] text-zinc-400">알림 메시지 1</label>
            <input type="text" id="msg1" value="기어들어온 기분이 어때?" class="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-zinc-500">
          </div>

          <div>
            <label class="text-[11px] text-zinc-400">알림 메시지 2</label>
            <input type="text" id="msg2" value="네가 없으면 안 돼." class="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-zinc-500">
          </div>

          <div class="grid grid-cols-2 gap-2 pt-1 border-t border-zinc-800">
            <div>
              <label class="text-[11px] text-zinc-400">음악 제목</label>
              <input type="text" id="songTitle" value="Mystery of Love" class="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-zinc-500">
            </div>
            <div>
              <label class="text-[11px] text-zinc-400">가수 / 테마</label>
              <input type="text" id="artistName" value="Sufjan Stevens" class="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-zinc-500">
            </div>
          </div>
        </div>

        <!-- [탭 3] 테마 색상 팔레트 -->
        <div id="tab3" class="tab-content hidden space-y-3">
          <label class="block text-xs font-medium text-zinc-400">포인트 테마 색상 선택</label>
          <div class="flex items-center gap-2.5 flex-wrap">
            <button class="color-btn w-8 h-8 rounded-full bg-[#ff2a85] ring-2 ring-white ring-offset-2 ring-offset-zinc-900 transition" data-color="#ff2a85" title="도파 핑크"></button>
            <button class="color-btn w-8 h-8 rounded-full bg-[#8b5cf6] transition" data-color="#8b5cf6" title="라벤더 퍼플"></button>
            <button class="color-btn w-8 h-8 rounded-full bg-[#38bdf8] transition" data-color="#38bdf8" title="세레니티 블루"></button>
            <button class="color-btn w-8 h-8 rounded-full bg-[#34d399] transition" data-color="#34d399" title="소프트 민트"></button>
            <button class="color-btn w-8 h-8 rounded-full bg-[#e4e4e7] transition" data-color="#e4e4e7" title="모노 화이트"></button>
            
            <div class="flex items-center gap-1.5 ml-2 pl-2 border-l border-zinc-800">
              <input type="color" id="nativeColorPicker" value="#ff2a85" class="w-8 h-8 rounded-lg cursor-pointer bg-transparent border-0">
              <span id="hexDisplay" class="text-xs font-mono text-zinc-400">#ff2a85</span>
            </div>
          </div>
          <p class="text-[11px] text-zinc-500 pt-1">
            재생 프로그레스 바, 알림 배지, 반짝이 이펙트의 포인트 색상으로 적용됩니다.
          </p>
        </div>

      </div>
    </div>

    <!-- 미니멀 크레딧 (자연스러운 스텔스 브랜딩) -->
    <footer class="text-center pt-2">
      <a href="https://your-dopa-url.com" target="_blank" class="inline-flex items-center gap-1.5 text-[11px] text-zinc-500 hover:text-zinc-300 transition">
        <span>crafted for lovers & creators</span>
        <span>·</span>
        <span class="font-medium underline underline-offset-2">dopa studio</span>
      </a>
    </footer>

  </main>

  <script>
    // 캔버스 초기화
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');

    // 이미지 및 테마 상태
    let bgImg = null;
    let phoneImg = null;
    let animProgress = 0;
    let themeColor = '#ff2a85';

    // 폼 참조
    const bgInput = document.getElementById('bgInput');
    const phoneInput = document.getElementById('phoneInput');
    const quoteText = document.getElementById('quoteText');
    const phoneTime = document.getElementById('phoneTime');
    const senderName = document.getElementById('senderName');
    const msg1 = document.getElementById('msg1');
    const msg2 = document.getElementById('msg2');
    const songTitle = document.getElementById('songTitle');
    const artistName = document.getElementById('artistName');
    const nativeColorPicker = document.getElementById('nativeColorPicker');
    const hexDisplay = document.getElementById('hexDisplay');

    // 탭 전환 처리
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('border-indigo-500', 'text-white');
          b.classList.add('border-transparent', 'text-zinc-400');
        });
        btn.classList.add('border-indigo-500', 'text-white');
        btn.classList.remove('border-transparent', 'text-zinc-400');

        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.getElementById(btn.dataset.tab).classList.remove('hidden');
      });
    });

    // 컬러 칩 선택
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('ring-2', 'ring-white', 'ring-offset-2', 'ring-offset-zinc-900'));
        btn.classList.add('ring-2', 'ring-white', 'ring-offset-2', 'ring-offset-zinc-900');
        themeColor = btn.dataset.color;
        nativeColorPicker.value = themeColor;
        hexDisplay.textContent = themeColor;
        draw();
      });
    });

    nativeColorPicker.addEventListener('input', (e) => {
      themeColor = e.target.value;
      hexDisplay.textContent = themeColor;
      draw();
    });

    // 이미지 파일 로더
    function bindImageUpload(inputEl, callback) {
      inputEl.addEventListener('change', () => {
        if (inputEl.files && inputEl.files[0]) {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => { callback(img); draw(); };
            img.src = e.target.result;
          };
          reader.readAsDataURL(inputEl.files[0]);
        }
      });
    }
    bindImageUpload(bgInput, (img) => bgImg = img);
    bindImageUpload(phoneInput, (img) => phoneImg = img);

    [quoteText, phoneTime, senderName, msg1, msg2, songTitle, artistName].forEach(el => {
      el.addEventListener('input', () => draw());
    });

    // 에러 없는 캔버스 둥근 사각형 유틸
    function drawRoundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    // 메인 드로잉 함수
    function draw(prog = animProgress) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. 배경 이미지 렌더링
      if (bgImg) {
        const scale = Math.max(canvas.width / bgImg.width, canvas.height / bgImg.height);
        const w = bgImg.width * scale;
        const h = bgImg.height * scale;
        ctx.drawImage(bgImg, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
      } else {
        // 일러스트 없을 때 기본 감성 다크 그라데이션
        const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grad.addColorStop(0, '#1c1917');
        grad.addColorStop(0.5, '#0f172a');
        grad.addColorStop(1, '#020617');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#71717a';
        ctx.font = '13px Pretendard';
        ctx.textAlign = 'center';
        ctx.fillText('이미지 탭에서 일러스트를 등록해주세요', canvas.width / 2, 260);
      }

      // 비네팅 톤 다운 (가독성 향상)
      ctx.fillStyle = 'rgba(9, 9, 11, 0.4)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. 글리터 반짝임 루프 (십자 별빛)
      renderGlitter(prog);

      // 3. 상단 대사 인용 카드
      renderQuoteCard();

      // 4. 좌측 미니 뮤직 플레이어 위젯
      renderMusicPlayer(prog);

      // 5. 우측 아이폰 잠금화면 목업
      renderIPhoneMockup(prog);
    }

    // 십자 글리터 별빛 렌더러
    const glitterCoords = [
      { x: 50, y: 180, s: 7, p: 0.1 },
      { x: 230, y: 70, s: 9, p: 0.4 },
      { x: 70, y: 530, s: 8, p: 0.7 },
      { x: 270, y: 640, s: 6, p: 0.25 },
      { x: 190, y: 440, s: 7, p: 0.85 }
    ];
    function renderGlitter(prog) {
      glitterCoords.forEach(item => {
        const alpha = Math.sin((prog + item.p) * Math.PI * 2) * 0.45 + 0.55;
        ctx.save();
        ctx.strokeStyle = '#ffffff';
        ctx.fillStyle = themeColor;
        ctx.globalAlpha = alpha;

        // 중심 원
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.s * 0.35, 0, Math.PI * 2);
        ctx.fill();

        // 십자 빛
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(item.x - item.s * 1.6, item.y); ctx.lineTo(item.x + item.s * 1.6, item.y);
        ctx.moveTo(item.x, item.y - item.s * 1.6); ctx.lineTo(item.x, item.y + item.s * 1.6);
        ctx.stroke();
        ctx.restore();
      });
    }

    // 상단 대사 인용 카드
    function renderQuoteCard() {
      const text = quoteText.value.trim();
      if (!text) return;
      const qx = 35, qy = 50, qw = 260, qh = 42;

      ctx.save();
      drawRoundRect(ctx, qx, qy, qw, qh, 21);
      ctx.fillStyle = 'rgba(18, 18, 23, 0.75)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 인용 부호
      ctx.fillStyle = themeColor;
      ctx.font = 'bold 15px Pretendard';
      ctx.textAlign = 'left';
      ctx.fillText('“', qx + 14, qy + 26);

      // 대사 텍스트
      ctx.fillStyle = '#f4f4f5';
      ctx.font = '500 11.5px Pretendard';
      ctx.fillText(text.length > 17 ? text.slice(0, 17) + '...' : text, qx + 30, qy + 26);
      ctx.restore();
    }

    // 미니 뮤직 플레이어 위젯 (Apple Music 감성)
    function renderMusicPlayer(prog) {
      const mx = 35, my = 290, mw = 220, mh = 98;

      ctx.save();
      // 글래스모피즘 베이스
      drawRoundRect(ctx, mx, my, mw, mh, 16);
      ctx.fillStyle = 'rgba(15, 15, 20, 0.85)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 앨범 커버
      drawRoundRect(ctx, mx + 12, my + 14, 42, 42, 8);
      ctx.fillStyle = '#27272a';
      ctx.fill();
      if (bgImg) {
        ctx.save();
        drawRoundRect(ctx, mx + 12, my + 14, 42, 42, 8);
        ctx.clip();
        ctx.drawImage(bgImg, mx + 12, my + 14, 42, 42);
        ctx.restore();
      }

      // 곡 정보
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px Pretendard';
      ctx.textAlign = 'left';
      const title = songTitle.value;
      ctx.fillText(title.length > 12 ? title.slice(0, 12) + '..' : title, mx + 64, my + 30);

      ctx.fillStyle = '#a1a1aa';
      ctx.font = '10.5px Pretendard';
      const artist = artistName.value;
      ctx.fillText(artist.length > 13 ? artist.slice(0, 13) + '..' : artist, mx + 64, my + 46);

      // 움직이는 재생 프로그레스 바
      const bx = mx + 14, by = my + 72, bw = mw - 28;
      ctx.beginPath();
      ctx.moveTo(bx, by); ctx.lineTo(bx + bw, by);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.stroke();

      // 현재 진행 바 (부드러운 전진 루프)
      const currentFill = bw * (0.3 + prog * 0.4);
      ctx.beginPath();
      ctx.moveTo(bx, by); ctx.lineTo(bx + currentFill, by);
      ctx.strokeStyle = themeColor;
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.stroke();

      // 헤드 핀
      ctx.beginPath();
      ctx.arc(bx + currentFill, by, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // 우측 하단 미니멀 워터마크 (스텔스 브랜딩)
      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.font = '9px monospace';
      ctx.textAlign = 'right';
      ctx.fillText('dopa', mx + mw - 14, my + 88);

      ctx.restore();
    }

    // 아이폰 잠금화면 목업
    function renderIPhoneMockup(prog) {
      const px = 275, py = 105, pw = 230, ph = 480, r = 36;

      ctx.save();
      // 스마트폰 그림자
      ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
      ctx.shadowBlur = 20;
      ctx.shadowOffsetX = 4;
      ctx.shadowOffsetY = 10;

      // 외곽 프레임
      drawRoundRect(ctx, px, py, pw, ph, r);
      ctx.fillStyle = '#09090b';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#27272a';
      ctx.stroke();
      ctx.restore();

      // 스크린 클리핑 영역
      ctx.save();
      drawRoundRect(ctx, px + 5, py + 5, pw - 10, ph - 10, r - 4);
      ctx.clip();

      // 폰 내부 배경 일러스트
      const targetPhoneImg = phoneImg || bgImg;
      if (targetPhoneImg) {
        const s = Math.max((pw - 10) / targetPhoneImg.width, (ph - 10) / targetPhoneImg.height);
        const iw = targetPhoneImg.width * s, ih = targetPhoneImg.height * s;
        ctx.drawImage(targetPhoneImg, px + 5 + (pw - 10 - iw) / 2, py + 5 + (ph - 10 - ih) / 2, iw, ih);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fillRect(px + 5, py + 5, pw - 10, ph - 10);
      } else {
        ctx.fillStyle = '#18181b';
        ctx.fillRect(px + 5, py + 5, pw - 10, ph - 10);
      }

      // 다이내믹 아일랜드
      drawRoundRect(ctx, px + pw / 2 - 32, py + 14, 64, 18, 9);
      ctx.fillStyle = '#000000';
      ctx.fill();

      // 잠금화면 시계 (콜론 깜빡임)
      const colon = prog < 0.5 ? ':' : ' ';
      const timeVal = phoneTime.value.includes(':') ? phoneTime.value.replace(':', colon) : phoneTime.value;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 36px Pretendard';
      ctx.textAlign = 'center';
      ctx.fillText(timeVal, px + pw / 2, py + 98);

      // 알림 메시지 카드 1 & 2
      renderNotiBubble(px + 12, py + 130, pw - 24, 48, senderName.value, msg1.value);
      renderNotiBubble(px + 12, py + 186, pw - 24, 48, senderName.value, msg2.value);

      ctx.restore();
    }

    // 알림 메시지 카드
    function renderNotiBubble(x, y, w, h, name, message) {
      ctx.save();
      drawRoundRect(ctx, x, y, w, h, 14);
      ctx.fillStyle = 'rgba(24, 24, 27, 0.82)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 프로필 아바타 원형
      ctx.beginPath();
      ctx.arc(x + 20, y + h / 2, 12, 0, Math.PI * 2);
      ctx.fillStyle = themeColor;
      ctx.fill();

      // 아바타 내부 미니멀 아이콘
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 9px Pretendard';
      ctx.textAlign = 'center';
      ctx.fillText('♥', x + 20, y + h / 2 + 3);

      // 발신자 이름
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px Pretendard';
      ctx.textAlign = 'left';
      ctx.fillText(name, x + 40, y + 20);

      // 메시지 내용
      ctx.fillStyle = '#d4d4d8';
      ctx.font = '10px Pretendard';
      ctx.fillText(message.length > 12 ? message.slice(0, 12) + '...' : message, x + 40, y + 36);

      ctx.restore();
    }

    // 15fps 부드러운 미리보기 루프
    draw(0);
    setInterval(() => {
      animProgress = (animProgress + 0.05) % 1;
      draw(animProgress);
    }, 100);

    // ================= GIF 생성 및 저장 로직 =================
    const btnGenerate = document.getElementById('btnGenerate');
    const loadingStatus = document.getElementById('loadingStatus');
    const progressBar = document.getElementById('progressBar');
    const statusMsg = document.getElementById('statusMsg');
    const resultArea = document.getElementById('resultArea');
    const resultGif = document.getElementById('resultGif');
    const btnDownload = document.getElementById('btnDownload');
    const btnShareX = document.getElementById('btnShareX');

    btnGenerate.addEventListener('click', () => {
      btnGenerate.disabled = true;
      loadingStatus.classList.remove('hidden');
      resultArea.classList.add('hidden');
      progressBar.style.width = '15%';
      statusMsg.textContent = '프레임 캡처 중...';

      // 가벼운 10프레임 루프 (모바일 브라우저 최적화)
      const frames = [];
      const totalFrames = 10;
      for (let i = 0; i < totalFrames; i++) {
        draw(i / totalFrames);
        frames.push(canvas.toDataURL('image/png'));
      }

      progressBar.style.width = '45%';
      statusMsg.textContent = 'GIF 인코딩 중...';

      gifshot.createGIF({
        images: frames,
        gifWidth: 400,
        gifHeight: 518,
        interval: 0.12,
        numWorkers: 2
      }, function(obj) {
        btnGenerate.disabled = false;
        loadingStatus.classList.add('hidden');

        if (!obj.error) {
          resultGif.src = obj.image;
          btnDownload.href = obj.image;
          resultArea.classList.remove('hidden');
          resultArea.scrollIntoView({ behavior: 'smooth' });
        } else {
          alert('GIF 생성 실패: 다시 시도해주세요.');
        }
      });
    });

    // 트위터 공유 (과한 홍보 없이 자연스러운 해시태그)
    btnShareX.addEventListener('click', () => {
      const url = window.location.href;
      const text = encodeURIComponent(`움짤 페어틀 메이커로 만든 우리 페어 ✨\n#페어틀 #움짤페어틀 #자캐 #드림\n`);
      window.open(`https://twitter.com/intent/tweet?text=${text}&url=${encodeURIComponent(url)}`, '_blank');
    });
  </script>
</body>
</html>
