<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>16:9 감성 움짤 페어틀 메이커 (고화질)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- gifshot (클라이언트 GIF 인코더) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
  <!-- Pretendard 감성 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    #previewCanvas { touch-action: none; cursor: grab; }
    #previewCanvas:active { cursor: grabbing; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
  </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen pb-16">

  <!-- 미니멀 헤더 -->
  <header class="border-b border-zinc-800/80 px-4 py-3 bg-[#09090b]/80 backdrop-blur sticky top-0 z-30 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <span class="text-xs font-semibold tracking-wider text-zinc-300 uppercase">16:9 Pair Gif Studio</span>
      <span class="text-[10px] text-teal-400 bg-teal-500/10 border border-teal-500/30 px-1.5 py-0.5 rounded font-mono">HD MODE</span>
    </div>
    <span class="text-xs text-zinc-500 font-mono">드래그 & 고화질</span>
  </header>

  <main class="max-w-xl mx-auto px-4 pt-4 space-y-4">

    <!-- 1. 16:9 와이드 캔버스 프리뷰 -->
    <div class="bg-zinc-950 rounded-2xl p-2.5 border border-zinc-800 shadow-2xl flex flex-col items-center">
      <div class="w-full flex items-center justify-between pb-2 px-1 text-[11px] text-zinc-400">
        <span class="flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          💡 <b>폰·대화창·플레이어를 터치해서 드래그해보세요!</b>
        </span>
        <button id="btnResetPositions" class="text-zinc-500 hover:text-zinc-300 text-[10px] underline">위치 초기화</button>
      </div>

      <!-- 16:9 캔버스 (기본 960 x 540) -->
      <canvas id="previewCanvas" width="960" height="540" class="w-full aspect-[16/9] rounded-xl bg-black shadow-inner"></canvas>
    </div>

    <!-- 2. 고화질 출력 설정 & 생성 버튼 -->
    <div class="space-y-3 bg-zinc-900/60 p-3.5 rounded-xl border border-zinc-800">
      
      <!-- 화질 및 포맷 선택 옵션 -->
      <div class="flex items-center justify-between text-xs pb-1">
        <span class="text-zinc-400 font-medium">내보내기 해상도</span>
        <div class="flex items-center gap-2">
          <label class="flex items-center gap-1 cursor-pointer">
            <input type="radio" name="resMode" value="960" checked class="accent-teal-400">
            <span class="text-zinc-300 text-[11px]">960p (빠름)</span>
          </label>
          <label class="flex items-center gap-1 cursor-pointer">
            <input type="radio" name="resMode" value="1280" class="accent-teal-400">
            <span class="text-zinc-300 text-[11px]">1280p (고화질)</span>
          </label>
        </div>
      </div>

      <!-- 내보내기 버튼 2종 (초고화질 MP4 vs 고화질 GIF) -->
      <div class="grid grid-cols-2 gap-2">
        <button id="btnGenerateMP4" class="py-3 bg-gradient-to-r from-teal-500 to-emerald-600 hover:opacity-95 text-white font-bold rounded-xl text-xs transition-all shadow-md active:scale-[0.99] flex items-center justify-center space-x-1.5">
          <span>✨ 무손실 MP4 저장</span>
        </button>
        <button id="btnGenerateGIF" class="py-3 bg-zinc-100 hover:bg-white text-zinc-950 font-bold rounded-xl text-xs transition-all shadow-md active:scale-[0.99] flex items-center justify-center space-x-1.5">
          <span>🎬 고화질 GIF 내보내기</span>
        </button>
      </div>
      <p class="text-[10px] text-zinc-500 text-center">
        💡 트위터 업로드 시 <b>[무손실 MP4]</b>가 깨짐·자글거림 전혀 없이 무한루프 움짤로 재생됩니다.
      </p>

      <!-- 인코딩 진행률 바 -->
      <div id="loadingStatus" class="hidden space-y-1.5 py-1">
        <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
          <div id="progressBar" class="bg-teal-400 h-full w-0 transition-all duration-200"></div>
        </div>
        <p id="statusMsg" class="text-center text-[11px] text-zinc-400 font-mono">고화질 렌더링 중...</p>
      </div>

      <!-- 완성 결과물 -->
      <div id="resultArea" class="hidden flex flex-col items-center space-y-3 pt-2">
        <div id="previewMediaWrapper" class="w-full max-w-[320px] rounded-lg overflow-hidden border border-zinc-700 shadow-xl aspect-[16/9]">
          <!-- img 또는 video가 동적으로 들어감 -->
        </div>
        <div class="flex w-full gap-2">
          <a id="btnDownload" download="aesthetic_pair_16x9" class="flex-1 py-2.5 bg-teal-600 hover:bg-teal-500 text-center font-semibold rounded-lg text-xs transition">
            💾 기기에 저장하기
          </a>
          <button id="btnShareX" class="py-2.5 px-4 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold rounded-lg text-xs transition flex items-center gap-1.5">
            𝕏 트윗
          </button>
        </div>
      </div>
    </div>

    <!-- 3. 모바일 탭 제어판 -->
    <div class="bg-zinc-900/80 rounded-2xl border border-zinc-800/80 overflow-hidden">
      <!-- 탭 바 -->
      <div class="grid grid-cols-3 border-b border-zinc-800 text-xs font-medium text-center">
        <button id="tabBtn1" class="tab-btn py-3 border-b-2 border-teal-400 text-white font-semibold transition" data-tab="tab1">🖼️ 이미지</button>
        <button id="tabBtn2" class="tab-btn py-3 border-b-2 border-transparent text-zinc-400 hover:text-zinc-200 transition" data-tab="tab2">✍️ 대사·말풍선</button>
        <button id="tabBtn3" class="tab-btn py-3 border-b-2 border-transparent text-zinc-400 hover:text-zinc-200 transition" data-tab="tab3">🎨 테마 색상</button>
      </div>

      <div class="p-4 space-y-4">
        
        <!-- [탭 1] 이미지 등록 -->
        <div id="tab1" class="tab-content space-y-3">
          <div>
            <label class="block text-xs font-medium text-zinc-300 mb-1.5">메인 일러스트 (전체 배경)</label>
            <input type="file" id="bgInput" accept="image/*" class="w-full text-xs text-zinc-400 file:mr-2.5 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-medium file:bg-zinc-800 file:text-zinc-200 hover:file:bg-zinc-700 cursor-pointer">
          </div>
          <div>
            <label class="block text-xs font-medium text-zinc-300 mb-1.5">스마트폰 속 이미지 (선택 / 비우면 메인 이미지 자동 적용)</label>
            <input type="file" id="phoneInput" accept="image/*" class="w-full text-xs text-zinc-400 file:mr-2.5 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-medium file:bg-zinc-800 file:text-zinc-200 hover:file:bg-zinc-700 cursor-pointer">
          </div>
        </div>

        <!-- [탭 2] 대사 & 동적 말풍선 관리 -->
        <div id="tab2" class="tab-content hidden space-y-4">
          <div>
            <label class="text-[11px] text-zinc-400">인용 대사 캡슐</label>
            <input type="text" id="quoteText" value="도파미너, 오랜만입니다." class="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-zinc-500">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] text-zinc-400">페어 이름 (메신저 상단)</label>
              <input type="text" id="senderName" value="도파" class="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-zinc-500">
            </div>
            <div>
              <label class="text-[11px] text-zinc-400">아이폰 시계</label>
              <input type="text" id="phoneTime" value="08:24" class="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-zinc-500">
            </div>
          </div>

          <!-- 동적 말풍선 리스트 -->
          <div class="space-y-2 border-t border-zinc-800 pt-3">
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold text-zinc-300">💬 메신저 말풍선 목록</span>
              <button id="btnAddBubble" class="px-2.5 py-1 bg-teal-500/20 text-teal-300 hover:bg-teal-500/30 text-[11px] font-medium rounded-md transition border border-teal-500/30">
                + 말풍선 추가
              </button>
            </div>
            <div id="bubblesContainer" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
          </div>

          <!-- 음악 플레이어 정보 -->
          <div class="grid grid-cols-2 gap-2 pt-2 border-t border-zinc-800">
            <div>
              <label class="text-[11px] text-zinc-400">곡명</label>
              <input type="text" id="songTitle" value="I Don't Think.." class="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-zinc-500">
            </div>
            <div>
              <label class="text-[11px] text-zinc-400">가수 / 테마</label>
              <input type="text" id="artistName" value="Charlie Puth" class="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-zinc-500">
            </div>
          </div>
        </div>

        <!-- [탭 3] 테마 컬러 팔레트 -->
        <div id="tab3" class="tab-content hidden space-y-3">
          <label class="block text-xs font-medium text-zinc-400">포인트 테마 색상</label>
          <div class="flex items-center gap-2.5 flex-wrap">
            <button class="color-btn w-8 h-8 rounded-full bg-[#f59e0b] ring-2 ring-white ring-offset-2 ring-offset-zinc-900 transition" data-color="#f59e0b" title="앰버 옐로우"></button>
            <button class="color-btn w-8 h-8 rounded-full bg-[#5eead4] transition" data-color="#5eead4" title="세이지 민트"></button>
            <button class="color-btn w-8 h-8 rounded-full bg-[#ff2a85] transition" data-color="#ff2a85" title="도파 핑크"></button>
            <button class="color-btn w-8 h-8 rounded-full bg-[#c084fc] transition" data-color="#c084fc" title="라벤더 퍼플"></button>
            <button class="color-btn w-8 h-8 rounded-full bg-[#38bdf8] transition" data-color="#38bdf8" title="세레니티 블루"></button>
            <button class="color-btn w-8 h-8 rounded-full bg-[#e4e4e7] transition" data-color="#e4e4e7" title="모노 화이트"></button>
            
            <div class="flex items-center gap-1.5 ml-1 pl-2 border-l border-zinc-800">
              <input type="color" id="nativeColorPicker" value="#f59e0b" class="w-8 h-8 rounded-lg cursor-pointer bg-transparent border-0">
              <span id="hexDisplay" class="text-xs font-mono text-zinc-400">#f59e0b</span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- 미니멀 푸터 -->
    <footer class="text-center pt-2">
      <a href="https://your-dopa-url.com" target="_blank" class="inline-flex items-center gap-1.5 text-[11px] text-zinc-500 hover:text-zinc-300 transition">
        <span>aesthetic pair kit</span>
        <span>·</span>
        <span class="font-medium underline underline-offset-2">dopa</span>
      </a>
    </footer>

  </main>

  <script>
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');

    // 고해상도 렌더링 품질 강제 지정
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    let bgImg = null;
    let phoneImg = null;
    let animProgress = 0;
    let themeColor = '#f59e0b'; // 레퍼런스 이미지 기반 앰버 옐로우

    // 요소 위치 상태
    const defaultElements = {
      quote:  { id: 'quote',  x: 600, y: 340, w: 230, h: 36 },
      chat:   { id: 'chat',   x: 40,  y: 110, w: 250, h: 360 },
      player: { id: 'player', x: 200, y: 350, w: 215, h: 86 },
      phone:  { id: 'phone',  x: 675, y: 45,  w: 232, h: 460 }
    };
    let elements = JSON.parse(JSON.stringify(defaultElements));

    let draggingItem = null;
    let dragOffset = { x: 0, y: 0 };

    // 말풍선 목록
    let chatBubbles = [
      { side: 'left', text: '반가워요, 도파미너.' },
      { side: 'right', text: '실장님! 안녕하세요.' },
      { side: 'left', text: '좋은 아침입니다.' },
      { side: 'left', text: '훗, 클로즈베타 신청 하실거죠?' }
    ];

    // DOM 참조
    const bgInput = document.getElementById('bgInput');
    const phoneInput = document.getElementById('phoneInput');
    const quoteText = document.getElementById('quoteText');
    const senderName = document.getElementById('senderName');
    const phoneTime = document.getElementById('phoneTime');
    const songTitle = document.getElementById('songTitle');
    const artistName = document.getElementById('artistName');
    const nativeColorPicker = document.getElementById('nativeColorPicker');
    const hexDisplay = document.getElementById('hexDisplay');
    const bubblesContainer = document.getElementById('bubblesContainer');
    const btnAddBubble = document.getElementById('btnAddBubble');
    const btnResetPositions = document.getElementById('btnResetPositions');

    btnResetPositions.addEventListener('click', () => {
      elements = JSON.parse(JSON.stringify(defaultElements));
      draw();
    });

    // 말풍선 UI 동적 생성
    function renderBubbleInputs() {
      bubblesContainer.innerHTML = '';
      chatBubbles.forEach((bubble, idx) => {
        const row = document.createElement('div');
        row.className = 'flex items-center gap-1.5 bg-zinc-950 p-1.5 rounded-lg border border-zinc-800 text-xs';
        row.innerHTML = `
          <button class="toggle-side px-2 py-1 rounded text-[10px] font-bold ${bubble.side === 'left' ? 'bg-zinc-800 text-zinc-300' : 'bg-amber-500/20 text-amber-300'}" data-index="${idx}">
            ${bubble.side === 'left' ? '← 상대' : '나 →'}
          </button>
          <input type="text" value="${bubble.text}" class="bubble-text flex-1 bg-transparent border-0 text-white text-xs px-1 focus:outline-none" data-index="${idx}">
          <button class="delete-bubble text-zinc-500 hover:text-red-400 px-1.5" data-index="${idx}">✕</button>
        `;
        bubblesContainer.appendChild(row);
      });

      elements.chat.h = Math.max(260, 80 + chatBubbles.length * 48 + 40);

      document.querySelectorAll('.toggle-side').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const i = e.target.dataset.index;
          chatBubbles[i].side = chatBubbles[i].side === 'left' ? 'right' : 'left';
          renderBubbleInputs();
          draw();
        });
      });

      document.querySelectorAll('.bubble-text').forEach(input => {
        input.addEventListener('input', (e) => {
          chatBubbles[e.target.dataset.index].text = e.target.value;
          draw();
        });
      });

      document.querySelectorAll('.delete-bubble').forEach(btn => {
        btn.addEventListener('click', (e) => {
          if (chatBubbles.length <= 1) return;
          chatBubbles.splice(e.target.dataset.index, 1);
          renderBubbleInputs();
          draw();
        });
      });
    }

    btnAddBubble.addEventListener('click', () => {
      chatBubbles.push({ side: 'left', text: '새로운 메시지' });
      renderBubbleInputs();
      draw();
    });

    renderBubbleInputs();

    // 탭 전환
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('border-teal-400', 'text-white');
          b.classList.add('border-transparent', 'text-zinc-400');
        });
        btn.classList.add('border-teal-400', 'text-white');
        btn.classList.remove('border-transparent', 'text-zinc-400');

        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.getElementById(btn.dataset.tab).classList.remove('hidden');
      });
    });

    // 컬러 칩
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('ring-2', 'ring-white', 'ring-offset-2', 'ring-offset-zinc-900'));
        btn.classList.add('ring-2', 'ring-white', 'ring-offset-2', 'ring-offset-zinc-900');
        themeColor = btn.dataset.color;
        nativeColorPicker.value = themeColor;
        hexDisplay.textContent = themeColor;
        draw();
      });
    });

    nativeColorPicker.addEventListener('input', (e) => {
      themeColor = e.target.value;
      hexDisplay.textContent = themeColor;
      draw();
    });

    // 이미지 로드
    function bindImage(inputEl, callback) {
      inputEl.addEventListener('change', () => {
        if (inputEl.files && inputEl.files[0]) {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => { callback(img); draw(); };
            img.src = e.target.result;
          };
          reader.readAsDataURL(inputEl.files[0]);
        }
      });
    }
    bindImage(bgInput, (img) => bgImg = img);
    bindImage(phoneInput, (img) => phoneImg = img);

    [quoteText, senderName, phoneTime, songTitle, artistName].forEach(el => {
      el.addEventListener('input', () => draw());
    });

    // 마우스/터치 드래그 위치 계산
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function handleDragStart(e) {
      const pos = getCanvasCoords(e);
      const order = ['quote', 'player', 'chat', 'phone'];
      for (const key of order) {
        const item = elements[key];
        if (pos.x >= item.x && pos.x <= item.x + item.w &&
            pos.y >= item.y && pos.y <= item.y + item.h) {
          draggingItem = key;
          dragOffset.x = pos.x - item.x;
          dragOffset.y = pos.y - item.y;
          if (e.cancelable) e.preventDefault();
          break;
        }
      }
    }

    function handleDragMove(e) {
      if (!draggingItem) return;
      const pos = getCanvasCoords(e);
      elements[draggingItem].x = Math.round(pos.x - dragOffset.x);
      elements[draggingItem].y = Math.round(pos.y - dragOffset.y);
      if (e.cancelable) e.preventDefault();
      draw();
    }

    function handleDragEnd() {
      draggingItem = null;
    }

    canvas.addEventListener('mousedown', handleDragStart);
    window.addEventListener('mousemove', handleDragMove);
    window.addEventListener('mouseup', handleDragEnd);

    canvas.addEventListener('touchstart', handleDragStart, { passive: false });
    window.addEventListener('touchmove', handleDragMove, { passive: false });
    window.addEventListener('touchend', handleDragEnd);

    function roundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y + x, y, r);
      c.closePath();
    }

    // ================= 메인 드로잉 =================
    function draw(prog = animProgress, targetCtx = ctx, wScale = 1, hScale = 1) {
      const c = targetCtx;
      const cvWidth = canvas.width * wScale;
      const cvHeight = canvas.height * hScale;

      c.save();
      c.scale(wScale, hScale);
      c.clearRect(0, 0, canvas.width, canvas.height);

      // 1. 전체 배경 일러스트
      if (bgImg) {
        const scale = Math.max(canvas.width / bgImg.width, canvas.height / bgImg.height);
        const w = bgImg.width * scale;
        const h = bgImg.height * scale;
        c.drawImage(bgImg, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
      } else {
        const grad = c.createLinearGradient(0, 0, canvas.width, canvas.height);
        grad.addColorStop(0, '#1c1924');
        grad.addColorStop(0.6, '#0f172a');
        grad.addColorStop(1, '#020617');
        c.fillStyle = grad;
        c.fillRect(0, 0, canvas.width, canvas.height);

        c.fillStyle = '#94a3b8';
        c.font = 'bold 15px Pretendard';
        c.textAlign = 'center';
        c.fillText('이미지 탭에서 일러스트를 등록해주세요', 300, 270);
      }

      // 우측 은은한 비네팅
      const rightVignette = c.createLinearGradient(200, 0, canvas.width, 0);
      rightVignette.addColorStop(0, 'rgba(10, 12, 18, 0.05)');
      rightVignette.addColorStop(0.5, 'rgba(10, 12, 18, 0.35)');
      rightVignette.addColorStop(1, 'rgba(10, 12, 18, 0.65)');
      c.fillStyle = rightVignette;
      c.fillRect(0, 0, canvas.width, canvas.height);

      // 2. 글리터 별빛
      renderGlitterStars(c, prog);

      // 3. 레이어 렌더링
      renderIPhone16(c, prog);
      renderGlassChatWindow(c);
      renderFloatingMusicPlayer(c, prog);
      renderTopQuotePill(c);

      // 드래그 가이드
      if (draggingItem && targetCtx === ctx) {
        const it = elements[draggingItem];
        c.save();
        c.strokeStyle = themeColor;
        c.lineWidth = 2;
        c.setLineDash([4, 4]);
        roundRect(c, it.x - 3, it.y - 3, it.w + 6, it.h + 6, 8);
        c.stroke();
        c.restore();
      }

      // 워터마크
      c.save();
      c.fillStyle = 'rgba(255, 255, 255, 0.4)';
      c.font = '10px monospace';
      c.textAlign = 'left';
      c.fillText('dopa pair kit · 16:9', 24, canvas.height - 18);
      c.restore();

      c.restore();
    }

    // 십자 반짝이
    const sparkles = [
      { x: 330, y: 140, s: 8, p: 0.1 },
      { x: 430, y: 920, s: 7, p: 0.4 },
      { x: 440, y: 460, s: 8, p: 0.7 },
      { x: 670, y: 490, s: 7, p: 0.85 }
    ];
    function renderGlitterStars(c, prog) {
      sparkles.forEach(st => {
        const alpha = Math.sin((prog + st.p) * Math.PI * 2) * 0.45 + 0.55;
        c.save();
        c.fillStyle = themeColor;
        c.strokeStyle = '#ffffff';
        c.globalAlpha = alpha;
        c.beginPath();
        c.arc(st.x, st.y, st.s * 0.35, 0, Math.PI * 2);
        c.fill();
        c.lineWidth = 1.4;
        c.beginPath();
        c.moveTo(st.x - st.s * 1.7, st.y); c.lineTo(st.x + st.s * 1.7, st.y);
        c.moveTo(st.x, st.y - st.s * 1.7); c.lineTo(st.x, st.y + st.s * 1.7);
        c.stroke();
        c.restore();
      });
    }

    // 대사 캡슐
    function renderTopQuotePill(c) {
      const it = elements.quote;
      const text = quoteText.value.trim();
      if (!text) return;

      c.save();
      roundRect(c, it.x, it.y, it.w, it.h, it.h / 2);
      c.fillStyle = 'rgba(255, 255, 255, 0.5)';
      c.fill();
      c.strokeStyle = themeColor;
      c.lineWidth = 1.4;
      c.shadowColor = themeColor;
      c.shadowBlur = 8;
      c.stroke();

      c.fillStyle = '#0f172a';
      c.font = 'bold 10.5px Pretendard';
      c.textAlign = 'center';
      c.fillText(text.length > 21 ? text.slice(0, 21) + '...' : text, it.x + it.w / 2, it.y + 22);
      c.restore();
    }

    // 메신저 창
    function renderGlassChatWindow(c) {
      const it = elements.chat;

      c.save();
      c.shadowColor = 'rgba(0, 0, 0, 0.3)';
      c.shadowBlur = 24;
      c.shadowOffsetY = 10;

      roundRect(c, it.x, it.y, it.w, it.h, 22);
      c.fillStyle = 'rgba(255, 255, 255, 0.78)';
      c.fill();
      c.strokeStyle = 'rgba(255, 255, 255, 0.9)';
      c.lineWidth = 1.5;
      c.stroke();
      c.restore();

      // 헤더 바
      c.save();
      const hx = it.x + 20, hy = it.y + 14, hw = it.w - 40, hh = 30;
      roundRect(c, hx, hy, hw, hh, 15);
      c.fillStyle = 'rgba(255, 255, 255, 0.65)';
      c.fill();
      c.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      c.stroke();

      c.beginPath();
      c.arc(hx + 16, hy + hh / 2, 8, 0, Math.PI * 2);
      c.fillStyle = themeColor;
      c.fill();

      c.fillStyle = '#1e293b';
      c.font = 'bold 11px Pretendard';
      c.textAlign = 'center';
      c.fillText(senderName.value, hx + hw / 2 + 5, hy + 19);

      // 말풍선 목록
      let currentY = it.y + 58;
      chatBubbles.forEach(bubble => {
        const isLeft = bubble.side === 'left';
        const bw = Math.min(185, it.w - 40);
        const bh = 34;
        const bx = isLeft ? (it.x + 14) : (it.x + it.w - bw - 14);

        roundRect(c, bx, currentY, bw, bh, 12);
        if (isLeft) {
          c.fillStyle = '#ffffff';
          c.fill();
          c.fillStyle = '#334155';
          c.font = 'bold 9.5px Pretendard';
          c.textAlign = 'left';
          c.fillText(bubble.text.length > 15 ? bubble.text.slice(0, 15) + '...' : bubble.text, bx + 10, currentY + 21);
        } else {
          c.fillStyle = themeColor;
          c.fill();
          c.fillStyle = '#0f172a';
          c.font = 'bold 9.5px Pretendard';
          c.textAlign = 'left';
          c.fillText(bubble.text.length > 15 ? bubble.text.slice(0, 15) + '...' : bubble.text, bx + 10, currentY + 21);
        }
        currentY += 42;
      });

      // 하단 입력바
      const ix = it.x + 14, iy = it.y + it.h - 38, iw = it.w - 28, ih = 26;
      roundRect(c, ix, iy, iw, ih, 13);
      c.fillStyle = '#ffffff';
      c.fill();
      c.fillStyle = '#94a3b8';
      c.font = '11px sans-serif';
      c.fillText('+', ix + 10, iy + 17);
      c.font = '9px Pretendard';
      c.fillText('메시지 보내기...', ix + 26, iy + 17);
      c.fillText('📷', ix + iw - 18, iy + 17);

      c.restore();
    }

    // 미니 플레이어
    function renderFloatingMusicPlayer(c, prog) {
      const it = elements.player;

      c.save();
      c.shadowColor = 'rgba(0, 0, 0, 0.45)';
      c.shadowBlur = 24;
      c.shadowOffsetY = 10;

      roundRect(c, it.x, it.y, it.w, it.h, 16);
      c.fillStyle = 'rgba(15, 17, 24, 0.92)';
      c.fill();
      c.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      c.lineWidth = 1;
      c.stroke();

      roundRect(c, it.x + 12, it.y + 12, 38, 38, 8);
      c.fillStyle = '#334155';
      c.fill();
      if (bgImg) {
        c.save();
        roundRect(c, it.x + 12, it.y + 12, 38, 38, 8);
        c.clip();
        c.drawImage(bgImg, it.x + 12, it.y + 12, 38, 38);
        c.restore();
      }

      c.fillStyle = '#ffffff';
      c.font = 'bold 11px Pretendard';
      c.textAlign = 'left';
      c.fillText(songTitle.value.length > 12 ? songTitle.value.slice(0, 12) + '..' : songTitle.value, it.x + 58, it.y + 26);

      c.fillStyle = '#94a3b8';
      c.font = '9.5px Pretendard';
      c.fillText(artistName.value.length > 14 ? artistName.value.slice(0, 14) + '..' : artistName.value, it.x + 58, it.y + 42);

      c.fillStyle = '#e2e8f0';
      c.font = '9px sans-serif';
      c.textAlign = 'center';
      c.fillText('⏮', it.x + 80, it.y + 64);
      c.fillText('▶', it.x + 110, it.y + 64);
      c.fillText('⏭', it.x + 140, it.y + 64);

      const bx = it.x + 12, by = it.y + 74, bw = it.w - 24;
      c.beginPath();
      c.moveTo(bx, by); c.lineTo(bx + bw, by);
      c.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      c.lineWidth = 3;
      c.lineCap = 'round';
      c.stroke();

      const curW = bw * (0.3 + prog * 0.4);
      c.beginPath();
      c.moveTo(bx, by); c.lineTo(bx + curW, by);
      c.strokeStyle = themeColor;
      c.lineWidth = 3;
      c.lineCap = 'round';
      c.stroke();

      c.beginPath();
      c.arc(bx + curW, by, 3.5, 0, Math.PI * 2);
      c.fillStyle = '#ffffff';
      c.fill();

      c.restore();
    }

    // 아이폰 목업
    function renderIPhone16(c, prog) {
      const it = elements.phone;

      c.save();
      c.shadowColor = 'rgba(0, 0, 0, 0.55)';
      c.shadowBlur = 28;
      c.shadowOffsetX = 8;
      c.shadowOffsetY = 15;

      roundRect(c, it.x, it.y, it.w, it.h, 36);
      c.fillStyle = '#090a0f';
      c.fill();
      c.lineWidth = 3;
      c.strokeStyle = '#2d3345';
      c.stroke();
      c.restore();

      c.save();
      roundRect(c, it.x + 5, it.y + 5, it.w - 10, it.h - 10, 32);
      c.clip();

      const targetImg = phoneImg || bgImg;
      if (targetImg) {
        const s = Math.max((it.w - 10) / targetImg.width, (it.h - 10) / targetImg.height);
        const iw = targetImg.width * s, ih = targetImg.height * s;
        c.drawImage(targetImg, it.x + 5 + (it.w - 10 - iw) / 2, it.y + 5 + (it.h - 10 - ih) / 2, iw, ih);
        c.fillStyle = 'rgba(10, 12, 18, 0.25)';
        c.fillRect(it.x + 5, it.y + 5, it.w - 10, it.h - 10);
      } else {
        c.fillStyle = '#1e1b4b';
        c.fillRect(it.x + 5, it.y + 5, it.w - 10, it.h - 10);
      }

      // 다이내믹 아일랜드
      roundRect(c, it.x + it.w / 2 - 32, it.y + 14, 64, 16, 8);
      c.fillStyle = '#000000';
      c.fill();

      // 시계
      const colon = prog < 0.5 ? ':' : ' ';
      const timeVal = phoneTime.value.includes(':') ? phoneTime.value.replace(':', colon) : phoneTime.value;
      c.fillStyle = '#ffffff';
      c.font = 'bold 34px Pretendard';
      c.textAlign = 'center';
      c.fillText(timeVal, it.x + it.w / 2, it.y + 92);

      // 하단 플레이어 미니 바
      const ipX = it.x + 14, ipY = it.y + it.h - 60, ipW = it.w - 28, ipH = 38;
      roundRect(c, ipX, ipY, ipW, ipH, 12);
      c.fillStyle = 'rgba(15, 23, 42, 0.82)';
      c.fill();
      c.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      c.stroke();

      c.fillStyle = '#ffffff';
      c.font = 'bold 9.5px Pretendard';
      c.textAlign = 'left';
      c.fillText(songTitle.value.length > 11 ? songTitle.value.slice(0, 11) + '..' : songTitle.value, ipX + 10, ipY + 18);

      c.fillStyle = '#94a3b8';
      c.font = '8px Pretendard';
      c.fillText(artistName.value.length > 13 ? artistName.value.slice(0, 13) + '..' : artistName.value, ipX + 10, ipY + 30);

      c.fillStyle = '#ffffff';
      c.font = '10px sans-serif';
      c.fillText('▶', ipX + ipW - 18, ipY + 23);

      c.restore();
    }

    // 15fps 실시간 프리뷰 루프
    draw(0);
    setInterval(() => {
      animProgress = (animProgress + 0.05) % 1;
      draw(animProgress);
    }, 100);

    // ================= 고화질 내보내기 로직 (GIF & MP4) =================
    const btnGenerateGIF = document.getElementById('btnGenerateGIF');
    const btnGenerateMP4 = document.getElementById('btnGenerateMP4');
    const loadingStatus = document.getElementById('loadingStatus');
    const progressBar = document.getElementById('progressBar');
    const statusMsg = document.getElementById('statusMsg');
    const resultArea = document.getElementById('resultArea');
    const previewMediaWrapper = document.getElementById('previewMediaWrapper');
    const btnDownload = document.getElementById('btnDownload');
    const btnShareX = document.getElementById('btnShareX');

    function getTargetDimensions() {
      const mode = document.querySelector('input[name="resMode"]:checked').value;
      if (mode === '1280') {
        return { w: 1280, h: 720, scale: 1280 / 960 };
      }
      return { w: 960, h: 540, scale: 1 };
    }

    // 1. 고화질 GIF 생성 (sampleInterval: 1 극강 화질)
    btnGenerateGIF.addEventListener('click', () => {
      btnGenerateGIF.disabled = true;
      btnGenerateMP4.disabled = true;
      loadingStatus.classList.remove('hidden');
      resultArea.classList.add('hidden');
      progressBar.style.width = '15%';
      statusMsg.textContent = '고화질 프레임 캡처 중...';

      const dim = getTargetDimensions();
      const offCanvas = document.createElement('canvas');
      offCanvas.width = dim.w;
      offCanvas.height = dim.h;
      const offCtx = offCanvas.getContext('2d');
      offCtx.imageSmoothingEnabled = true;
      offCtx.imageSmoothingQuality = 'high';

      const frames = [];
      const totalFrames = 10;
      for (let i = 0; i < totalFrames; i++) {
        draw(i / totalFrames, offCtx, dim.scale, dim.scale);
        frames.push(offCanvas.toDataURL('image/png'));
      }

      progressBar.style.width = '45%';
      statusMsg.textContent = '색상 최적화 인코딩 중 (잠시만 기다려주세요)...';

      gifshot.createGIF({
        images: frames,
        gifWidth: dim.w,
        gifHeight: dim.h,
        interval: 0.12,
        sampleInterval: 1, // ★ 노이즈 제거 핵심: 최고 정밀도 색상 추출
        numWorkers: 4
      }, function(obj) {
        btnGenerateGIF.disabled = false;
        btnGenerateMP4.disabled = false;
        loadingStatus.classList.add('hidden');

        if (!obj.error) {
          previewMediaWrapper.innerHTML = `<img src="${obj.image}" class="w-full h-full object-cover">`;
          btnDownload.href = obj.image;
          btnDownload.download = `aesthetic_pair_${dim.w}x${dim.h}.gif`;
          resultArea.classList.remove('hidden');
          resultArea.scrollIntoView({ behavior: 'smooth' });
        } else {
          alert('GIF 생성 실패: 다시 시도해주세요.');
        }
      });
    });

    // 2. 무손실 초고화질 MP4(비디오) 생성 (Canvas 스트림 즉시 녹화)
    btnGenerateMP4.addEventListener('click', () => {
      btnGenerateGIF.disabled = true;
      btnGenerateMP4.disabled = true;
      loadingStatus.classList.remove('hidden');
      resultArea.classList.add('hidden');
      progressBar.style.width = '20%';
      statusMsg.textContent = '무손실 60fps 비디오 녹화 중...';

      const dim = getTargetDimensions();
      const offCanvas = document.createElement('canvas');
      offCanvas.width = dim.w;
      offCanvas.height = dim.h;
      const offCtx = offCanvas.getContext('2d');
      offCtx.imageSmoothingEnabled = true;
      offCtx.imageSmoothingQuality = 'high';

      const stream = offCanvas.captureStream(60);
      let recorder;
      try {
        recorder = new MediaRecorder(stream, { mimeType: 'video/mp4; codecs="avc1.42E01E"' });
      } catch (e) {
        recorder = new MediaRecorder(stream);
      }

      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: recorder.mimeType });
        const videoUrl = URL.createObjectURL(blob);

        previewMediaWrapper.innerHTML = `<video src="${videoUrl}" autoplay loop muted playsinline class="w-full h-full object-cover"></video>`;
        btnDownload.href = videoUrl;
        btnDownload.download = `aesthetic_pair_${dim.w}x${dim.h}.mp4`;

        btnGenerateGIF.disabled = false;
        btnGenerateMP4.disabled = false;
        loadingStatus.classList.add('hidden');
        resultArea.classList.remove('hidden');
        resultArea.scrollIntoView({ behavior: 'smooth' });
      };

      recorder.start();

      // 1.5초 동안 고화질 루프 렌더링 녹화
      let currentFrame = 0;
      const totalSteps = 45; // 45프레임 부드러운 루프
      const interval = setInterval(() => {
        draw(currentFrame / totalSteps, offCtx, dim.scale, dim.scale);
        currentFrame++;
        progressBar.style.width = `${Math.min(90, Math.round((currentFrame / totalSteps) * 100))}%`;

        if (currentFrame >= totalSteps) {
          clearInterval(interval);
          recorder.stop();
        }
      }, 33);
    });

    // 트위터 공유
    btnShareX.addEventListener('click', () => {
      const url = window.location.href;
      const text = encodeURIComponent(`16:9 와이드 감성 페어틀 메이커 ✨\n#움짤페어틀 #페어틀 #자캐 #드림 #도파\n`);
      window.open(`https://twitter.com/intent/tweet?text=${text}&url=${encodeURIComponent(url)}`, '_blank');
    });
  </script>
</body>
</html>
