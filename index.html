<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>16:9 감성 움짤 페어틀 메이커</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- gifshot (GIF 생성기) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
  <!-- Pretendard 감성 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    #previewCanvas { touch-action: none; cursor: grab; }
    #previewCanvas:active { cursor: grabbing; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
  </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen pb-16">

  <!-- 미니멀 헤더 -->
  <header class="border-b border-zinc-800/80 px-4 py-3 bg-[#09090b]/80 backdrop-blur sticky top-0 z-30 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <span class="text-xs font-semibold tracking-wider text-zinc-300 uppercase">16:9 Pair Gif Studio</span>
      <span class="text-[10px] text-amber-400 bg-amber-500/10 border border-amber-500/30 px-1.5 py-0.5 rounded font-mono">PRO</span>
    </div>
    <span class="text-xs text-zinc-500 font-mono">1920×1080 (16:9)</span>
  </header>

  <main class="max-w-xl mx-auto px-4 pt-4 space-y-4">

    <!-- 1. 16:9 와이드 프리뷰 캔버스 -->
    <div class="bg-zinc-950 rounded-2xl p-2.5 border border-zinc-800 shadow-2xl flex flex-col items-center">
      <div class="w-full flex items-center justify-between pb-2 px-1 text-[11px] text-zinc-400">
        <span class="flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          💡 <b>폰·대화창·플레이어를 터치해서 드래그해보세요!</b>
        </span>
        <button id="btnResetPositions" class="text-zinc-500 hover:text-zinc-300 text-[10px] underline">위치 초기화</button>
      </div>

      <!-- 16:9 캔버스 (960 x 540) -->
      <canvas id="previewCanvas" width="960" height="540" class="w-full aspect-[16/9] rounded-xl bg-black shadow-inner"></canvas>
    </div>

    <!-- 2. 내보내기 버튼 (초고화질 MP4 & 고화질 GIF) -->
    <div class="space-y-3 bg-zinc-900/60 p-3.5 rounded-xl border border-zinc-800">
      <div class="grid grid-cols-2 gap-2">
        <button id="btnGenerateMP4" class="py-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:opacity-95 text-zinc-950 font-bold rounded-xl text-xs transition-all shadow-md active:scale-[0.99] flex items-center justify-center space-x-1.5">
          <span>✨ 무손실 MP4 저장</span>
        </button>
        <button id="btnGenerateGIF" class="py-3 bg-zinc-100 hover:bg-white text-zinc-950 font-bold rounded-xl text-xs transition-all shadow-md active:scale-[0.99] flex items-center justify-center space-x-1.5">
          <span>🎬 고화질 GIF 내보내기</span>
        </button>
      </div>
      <p class="text-[10px] text-zinc-500 text-center">
        💡 트위터 업로드 시 <b>[무손실 MP4]</b>가 깨짐·노이즈 없이 가장 선명하게 무한 루프 재생됩니다.
      </p>

      <!-- 인코딩 진행률 바 -->
      <div id="loadingStatus" class="hidden space-y-1.5 py-1">
        <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
          <div id="progressBar" class="bg-amber-400 h-full w-0 transition-all duration-200"></div>
        </div>
        <p id="statusMsg" class="text-center text-[11px] text-zinc-400 font-mono">고화질 렌더링 중...</p>
      </div>

      <!-- 완성 결과물 -->
      <div id="resultArea" class="hidden flex flex-col items-center space-y-3 pt-2">
        <div id="previewMediaWrapper" class="w-full max-w-[320px] rounded-lg overflow-hidden border border-zinc-700 shadow-xl aspect-[16/9] bg-black"></div>
        <div class="flex w-full gap-2">
          <a id="btnDownload" download="aesthetic_pair_16x9" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-400 text-zinc-950 text-center font-bold rounded-lg text-xs transition">
            💾 기기에 저장하기
          </a>
          <button id="btnShareX" class="py-2.5 px-4 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold rounded-lg text-xs transition flex items-center gap-1.5">
            𝕏 트윗
          </button>
        </div>
      </div>
    </div>

    <!-- 3. 모바일 탭 제어판 -->
    <div class="bg-zinc-900/80 rounded-2xl border border-zinc-800/80 overflow-hidden">
      <!-- 탭 바 -->
      <div class="grid grid-cols-3 border-b border-zinc-800 text-xs font-medium text-center">
        <button id="tabBtn1" class="tab-btn py-3 border-b-2 border-amber-400 text-white font-semibold transition" data-tab="tab1">🖼️ 이미지</button>
        <button id="tabBtn2" class="tab-btn py-3 border-b-2 border-transparent text-zinc-400 hover:text-zinc-200 transition" data-tab="tab2">✍️ 대사·시계</button>
        <button id="tabBtn3" class="tab-btn py-3 border-b-2 border-transparent text-zinc-400 hover:text-zinc-200 transition" data-tab="tab3">🎨 테마 색상</button>
      </div>

      <div class="p-4 space-y-4">
        
        <!-- [탭 1] 이미지 등록 -->
        <div id="tab1" class="tab-content space-y-3">
          <div>
            <label class="block text-xs font-medium text-zinc-300 mb-1.5">메인 일러스트 (전체 배경)</label>
            <input type="file" id="bgInput" accept="image/*" class="w-full text-xs text-zinc-400 file:mr-2.5 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-medium file:bg-zinc-800 file:text-zinc-200 hover:file:bg-zinc-700 cursor-pointer">
          </div>
          <div>
            <label class="block text-xs font-medium text-zinc-300 mb-1.5">스마트폰 속 이미지 (선택 / 비우면 메인 이미지 자동 적용)</label>
            <input type="file" id="phoneInput" accept="image/*" class="w-full text-xs text-zinc-400 file:mr-2.5 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-medium file:bg-zinc-800 file:text-zinc-200 hover:file:bg-zinc-700 cursor-pointer">
          </div>
        </div>

        <!-- [탭 2] 대사 & 아이폰 시계 위치 & 동적 말풍선 -->
        <div id="tab2" class="tab-content hidden space-y-4">
          
          <!-- 인용 대사 -->
          <div>
            <label class="text-[11px] text-zinc-400">인용 대사 캡슐 (라인 없는 미니멀 스타일)</label>
            <input type="text" id="quoteText" value="도파미너, 오랜만입니다." class="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-zinc-500">
          </div>

          <!-- 아이폰 시계 시간 & 상/중/하 위치 버튼 -->
          <div class="bg-zinc-950 p-2.5 rounded-xl border border-zinc-800 space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold text-zinc-300">📱 아이폰 시계 커스텀</span>
              <!-- 시계 위치 변경 버튼 3종 -->
              <div class="flex items-center gap-1 bg-zinc-900 p-0.5 rounded-lg border border-zinc-800">
                <button type="button" class="btn-clock-pos px-2 py-1 rounded text-[10px] font-bold transition bg-amber-500/20 text-amber-300" data-pos="top">⬆️ 상단</button>
                <button type="button" class="btn-clock-pos px-2 py-1 rounded text-[10px] font-bold transition text-zinc-400 hover:text-white" data-pos="middle">⏺️ 중단</button>
                <button type="button" class="btn-clock-pos px-2 py-1 rounded text-[10px] font-bold transition text-zinc-400 hover:text-white" data-pos="bottom">⬇️ 하단</button>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-[10px] text-zinc-500">표시 시간</label>
                <input type="text" id="phoneTime" value="08:24" class="w-full mt-0.5 bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-xs text-white">
              </div>
              <div>
                <label class="text-[10px] text-zinc-500">메신저 상대 이름</label>
                <input type="text" id="senderName" value="도파" class="w-full mt-0.5 bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-xs text-white">
              </div>
            </div>
          </div>

          <!-- 동적 말풍선 리스트 & 타이핑 모션 토글 -->
          <div class="space-y-2 border-t border-zinc-800 pt-3">
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold text-zinc-300">💬 메신저 말풍선</span>
              <button id="btnAddBubble" class="px-2.5 py-1 bg-amber-500/20 text-amber-300 hover:bg-amber-500/30 text-[11px] font-medium rounded-md transition border border-amber-500/30">
                + 말풍선 추가
              </button>
            </div>
            <div id="bubblesContainer" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
          </div>

          <!-- 음악 플레이어 정보 -->
          <div class="grid grid-cols-2 gap-2 pt-2 border-t border-zinc-800">
            <div>
              <label class="text-[11px] text-zinc-400">곡명</label>
              <input type="text" id="songTitle" value="I Don't Thin.." class="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-zinc-500">
            </div>
            <div>
              <label class="text-[11px] text-zinc-400">가수 / 테마</label>
              <input type="text" id="artistName" value="Charlie Puth" class="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-zinc-500">
            </div>
          </div>
        </div>

        <!-- [탭 3] 테마 컬러 팔레트 -->
        <div id="tab3" class="tab-content hidden space-y-3">
          <label class="block text-xs font-medium text-zinc-400">포인트 테마 색상</label>
          <div class="flex items-center gap-2.5 flex-wrap">
            <button class="color-btn w-8 h-8 rounded-full bg-[#f59e0b] ring-2 ring-white ring-offset-2 ring-offset-zinc-900 transition" data-color="#f59e0b" title="앰버 옐로우"></button>
            <button class="color-btn w-8 h-8 rounded-full bg-[#ff2a85] transition" data-color="#ff2a85" title="도파 핑크"></button>
            <button class="color-btn w-8 h-8 rounded-full bg-[#5eead4] transition" data-color="#5eead4" title="세이지 민트"></button>
            <button class="color-btn w-8 h-8 rounded-full bg-[#c084fc] transition" data-color="#c084fc" title="라벤더 퍼플"></button>
            <button class="color-btn w-8 h-8 rounded-full bg-[#38bdf8] transition" data-color="#38bdf8" title="세레니티 블루"></button>
            <button class="color-btn w-8 h-8 rounded-full bg-[#e4e4e7] transition" data-color="#e4e4e7" title="모노 화이트"></button>
            
            <div class="flex items-center gap-1.5 ml-1 pl-2 border-l border-zinc-800">
              <input type="color" id="nativeColorPicker" value="#f59e0b" class="w-8 h-8 rounded-lg cursor-pointer bg-transparent border-0">
              <span id="hexDisplay" class="text-xs font-mono text-zinc-400">#f59e0b</span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- 미니멀 푸터 -->
    <footer class="text-center pt-2">
      <a href="https://your-dopa-url.com" target="_blank" class="inline-flex items-center gap-1.5 text-[11px] text-zinc-500 hover:text-zinc-300 transition">
        <span>aesthetic pair kit</span>
        <span>·</span>
        <span class="font-medium underline underline-offset-2">dopa</span>
      </a>
    </footer>

  </main>

  <script>
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');

    let bgImg = null;
    let phoneImg = null;
    let animProgress = 0;
    let themeColor = '#f59e0b';
    let phoneClockPos = 'top'; // 'top' | 'middle' | 'bottom'

    // 안전한 둥근 사각형 렌더러
    function drawRoundRect(c, x, y, w, h, r) {
      if (typeof c.roundRect === 'function') {
        c.beginPath();
        c.roundRect(x, y, w, h, r);
        c.closePath();
      } else {
        c.beginPath();
        c.moveTo(x + r, y);
        c.lineTo(x + w - r, y);
        c.quadraticCurveTo(x + w, y, x + w, y + r);
        c.lineTo(x + w, y + h - r);
        c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        c.lineTo(x + r, y + h);
        c.quadraticCurveTo(x, y + h, x, y + h - r);
        c.lineTo(x, y + r);
        c.quadraticCurveTo(x, y, x + r, y);
        c.closePath();
      }
    }

    // 기본 위치 (사용자가 첨부한 이미지 구도 기반)
    const defaultElements = {
      quote:  { id: 'quote',  x: 580, y: 340, w: 240, h: 36 },
      chat:   { id: 'chat',   x: 30,  y: 90,  w: 255, h: 380 },
      player: { id: 'player', x: 190, y: 350, w: 220, h: 86 },
      phone:  { id: 'phone',  x: 675, y: 40,  w: 235, h: 460 }
    };
    let elements = JSON.parse(JSON.stringify(defaultElements));
    // 렌더링 순서(Z-index): 뒤 -> 앞
    let renderOrder = ['phone', 'chat', 'player', 'quote'];

    let draggingItem = null;
    let dragOffset = { x: 0, y: 0 };

    // 말풍선 목록
    let chatBubbles = [
      { side: 'left', text: '도파미너, 클로즈베타 기대되...' },
      { side: 'right', text: '네, 정말로요!' },
      { side: 'left', text: '저도 당신을 어서 만나고 싶...' },
      { side: 'left', text: '훗, 언제가 좋을까요?' }
    ];

    // DOM 참조
    const bgInput = document.getElementById('bgInput');
    const phoneInput = document.getElementById('phoneInput');
    const quoteText = document.getElementById('quoteText');
    const senderName = document.getElementById('senderName');
    const phoneTime = document.getElementById('phoneTime');
    const songTitle = document.getElementById('songTitle');
    const artistName = document.getElementById('artistName');
    const nativeColorPicker = document.getElementById('nativeColorPicker');
    const hexDisplay = document.getElementById('hexDisplay');
    const bubblesContainer = document.getElementById('bubblesContainer');
    const btnAddBubble = document.getElementById('btnAddBubble');
    const btnResetPositions = document.getElementById('btnResetPositions');

    // 시계 위치 버튼
    document.querySelectorAll('.btn-clock-pos').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-clock-pos').forEach(b => {
          b.classList.remove('bg-amber-500/20', 'text-amber-300');
          b.classList.add('text-zinc-400');
        });
        btn.classList.add('bg-amber-500/20', 'text-amber-300');
        btn.classList.remove('text-zinc-400');
        phoneClockPos = btn.dataset.pos;
        draw();
      });
    });

    btnResetPositions.addEventListener('click', () => {
      elements = JSON.parse(JSON.stringify(defaultElements));
      renderOrder = ['phone', 'chat', 'player', 'quote'];
      draw();
    });

    function renderBubbleInputs() {
      bubblesContainer.innerHTML = '';
      chatBubbles.forEach((bubble, idx) => {
        const row = document.createElement('div');
        row.className = 'flex items-center gap-1.5 bg-zinc-950 p-1.5 rounded-lg border border-zinc-800 text-xs';
        row.innerHTML = `
          <button class="toggle-side px-2 py-1 rounded text-[10px] font-bold ${bubble.side === 'left' ? 'bg-zinc-800 text-zinc-300' : 'bg-amber-500/20 text-amber-300'}" data-index="${idx}">
            ${bubble.side === 'left' ? '← 상대' : '나 →'}
          </button>
          <input type="text" value="${bubble.text}" class="bubble-text flex-1 bg-transparent border-0 text-white text-xs px-1 focus:outline-none" data-index="${idx}">
          <button class="delete-bubble text-zinc-500 hover:text-red-400 px-1.5" data-index="${idx}">✕</button>
        `;
        bubblesContainer.appendChild(row);
      });

      elements.chat.h = Math.max(260, 80 + chatBubbles.length * 48 + 40);

      document.querySelectorAll('.toggle-side').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const i = e.target.dataset.index;
          chatBubbles[i].side = chatBubbles[i].side === 'left' ? 'right' : 'left';
          renderBubbleInputs();
          draw();
        });
      });

      document.querySelectorAll('.bubble-text').forEach(input => {
        input.addEventListener('input', (e) => {
          chatBubbles[e.target.dataset.index].text = e.target.value;
          draw();
        });
      });

      document.querySelectorAll('.delete-bubble').forEach(btn => {
        btn.addEventListener('click', (e) => {
          if (chatBubbles.length <= 1) return;
          chatBubbles.splice(e.target.dataset.index, 1);
          renderBubbleInputs();
          draw();
        });
      });
    }

    btnAddBubble.addEventListener('click', () => {
      chatBubbles.push({ side: 'left', text: '새로운 메시지' });
      renderBubbleInputs();
      draw();
    });

    renderBubbleInputs();

    // 탭 전환
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('border-amber-400', 'text-white');
          b.classList.add('border-transparent', 'text-zinc-400');
        });
        btn.classList.add('border-amber-400', 'text-white');
        btn.classList.remove('border-transparent', 'text-zinc-400');

        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.getElementById(btn.dataset.tab).classList.remove('hidden');
      });
    });

    // 컬러 칩
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('ring-2', 'ring-white', 'ring-offset-2', 'ring-offset-zinc-900'));
        btn.classList.add('ring-2', 'ring-white', 'ring-offset-2', 'ring-offset-zinc-900');
        themeColor = btn.dataset.color;
        nativeColorPicker.value = themeColor;
        hexDisplay.textContent = themeColor;
        draw();
      });
    });

    nativeColorPicker.addEventListener('input', (e) => {
      themeColor = e.target.value;
      hexDisplay.textContent = themeColor;
      draw();
    });

    // 이미지 로더
    function bindImage(inputEl, callback) {
      inputEl.addEventListener('change', () => {
        if (inputEl.files && inputEl.files[0]) {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => { callback(img); draw(); };
            img.src = e.target.result;
          };
          reader.readAsDataURL(inputEl.files[0]);
        }
      });
    }
    bindImage(bgInput, (img) => bgImg = img);
    bindImage(phoneInput, (img) => phoneImg = img);

    [quoteText, senderName, phoneTime, songTitle, artistName].forEach(el => {
      el.addEventListener('input', () => draw());
    });

    // 드래그 좌표 계산 & 클릭한 요소 맨 앞으로 가져오기 (Smart Z-index)
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function handleDragStart(e) {
      const pos = getCanvasCoords(e);
      // 가장 위에 있는 요소부터 역순 검색
      for (let i = renderOrder.length - 1; i >= 0; i--) {
        const key = renderOrder[i];
        const item = elements[key];
        if (pos.x >= item.x && pos.x <= item.x + item.w &&
            pos.y >= item.y && pos.y <= item.y + item.h) {
          draggingItem = key;
          dragOffset.x = pos.x - item.x;
          dragOffset.y = pos.y - item.y;
          // 선택된 요소를 맨 위 레이어로 이동
          renderOrder.splice(i, 1);
          renderOrder.push(key);
          if (e.cancelable) e.preventDefault();
          draw();
          break;
        }
      }
    }

    function handleDragMove(e) {
      if (!draggingItem) return;
      const pos = getCanvasCoords(e);
      elements[draggingItem].x = Math.round(pos.x - dragOffset.x);
      elements[draggingItem].y = Math.round(pos.y - dragOffset.y);
      if (e.cancelable) e.preventDefault();
      draw();
    }

    function handleDragEnd() {
      draggingItem = null;
      draw();
    }

    canvas.addEventListener('mousedown', handleDragStart);
    window.addEventListener('mousemove', handleDragMove);
    window.addEventListener('mouseup', handleDragEnd);

    canvas.addEventListener('touchstart', handleDragStart, { passive: false });
    window.addEventListener('touchmove', handleDragMove, { passive: false });
    window.addEventListener('touchend', handleDragEnd);

    // ================= 메인 렌더링 =================
    function draw(prog = animProgress) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. 전체 배경 일러스트
      if (bgImg) {
        const scale = Math.max(canvas.width / bgImg.width, canvas.height / bgImg.height);
        const w = bgImg.width * scale;
        const h = bgImg.height * scale;
        ctx.drawImage(bgImg, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
      } else {
        const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grad.addColorStop(0, '#1c1924');
        grad.addColorStop(0.6, '#0f172a');
        grad.addColorStop(1, '#020617');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 15px Pretendard';
        ctx.textAlign = 'center';
        ctx.fillText('이미지 탭에서 페어 일러스트를 등록해주세요', 300, 270);
      }

      // 우측 가독성 비네팅
      const rightVignette = ctx.createLinearGradient(200, 0, canvas.width, 0);
      rightVignette.addColorStop(0, 'rgba(10, 12, 18, 0.05)');
      rightVignette.addColorStop(0.5, 'rgba(10, 12, 18, 0.35)');
      rightVignette.addColorStop(1, 'rgba(10, 12, 18, 0.65)');
      ctx.fillStyle = rightVignette;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. 글리터 별빛 (얼굴 부위 완전 제외, 외곽 여백만 배치)
      renderGlitterStars(prog);

      // 3. 레이어 순서대로 렌더링 (Z-index 적용)
      renderOrder.forEach(key => {
        if (key === 'phone') renderIPhone16(prog);
        if (key === 'chat') renderGlassChatWindow(prog);
        if (key === 'player') renderFloatingMusicPlayer(prog);
        if (key === 'quote') renderTopQuotePill();
      });

      // 드래그 중인 오브젝트 하이라이트 점선 가이드
      if (draggingItem) {
        const it = elements[draggingItem];
        ctx.save();
        ctx.strokeStyle = themeColor;
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        drawRoundRect(ctx, it.x - 3, it.y - 3, it.w + 6, it.h + 6, 8);
        ctx.stroke();
        ctx.restore();
      }

      // 좌측 하단 미니멀 도파 워터마크
      ctx.save();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.font = '10px monospace';
      ctx.textAlign = 'left';
      ctx.fillText('dopa pair kit · 16:9', 24, canvas.height - 18);
      ctx.restore();
    }

    // 십자 반짝이 (얼굴 영역 300~550, 50~450 배제)
    const sparkles = [
      { x: 90,  y: 60,  s: 7, p: 0.1 },  // 좌상단 모서리
      { x: 120, y: 500, s: 7, p: 0.7 },  // 좌하단 바닥
      { x: 620, y: 505, s: 8, p: 0.3 },  // 하단 손 아래 여백
      { x: 920, y: 50,  s: 6, p: 0.85 }  // 우상단 모서리
    ];
    function renderGlitterStars(prog) {
      sparkles.forEach(st => {
        const alpha = Math.sin((prog + st.p) * Math.PI * 2) * 0.45 + 0.55;
        ctx.save();
        ctx.fillStyle = themeColor;
        ctx.strokeStyle = '#ffffff';
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.s * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(st.x - st.s * 1.7, st.y); ctx.lineTo(st.x + st.s * 1.7, st.y);
        ctx.moveTo(st.x, st.y - st.s * 1.7); ctx.lineTo(st.x, st.y + st.s * 1.7);
        ctx.stroke();
        ctx.restore();
      });
    }

    // 인용 대사 캡슐 (요청: 외곽 테두리 라인 완전 제거)
    function renderTopQuotePill() {
      const it = elements.quote;
      const text = quoteText.value.trim();
      if (!text) return;

      ctx.save();
      drawRoundRect(ctx, it.x, it.y, it.w, it.h, it.h / 2);
      // 테두리 라인 없이 부드러운 반투명 블러 느낌만 연출
      ctx.fillStyle = 'rgba(15, 17, 24, 0.75)';
      ctx.fill();

      // 인용 부호
      ctx.fillStyle = themeColor;
      ctx.font = 'bold 12px Pretendard';
      ctx.textAlign = 'left';
      ctx.fillText('“', it.x + 14, it.y + 22);

      ctx.fillStyle = '#ffffff';
      ctx.font = '500 10.5px Pretendard';
      ctx.fillText(text.length > 21 ? text.slice(0, 21) + '...' : text, it.x + 28, it.y + 22);
      ctx.restore();
    }

    // 메신저 창 (요청: '...' 타이핑 애니메이션 후 순차적 말풍선 등장)
    function renderGlassChatWindow(prog) {
      const it = elements.chat;

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
      ctx.shadowBlur = 24;
      ctx.shadowOffsetY = 10;

      // 본체 (테두리 라인은 얇고 부드럽게)
      drawRoundRect(ctx, it.x, it.y, it.w, it.h, 22);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.82)';
      ctx.fill();
      ctx.restore();

      // 헤더 바
      ctx.save();
      const hx = it.x + 20, hy = it.y + 14, hw = it.w - 40, hh = 30;
      drawRoundRect(ctx, hx, hy, hw, hh, 15);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(hx + 16, hy + hh / 2, 8, 0, Math.PI * 2);
      ctx.fillStyle = themeColor;
      ctx.fill();

      ctx.fillStyle = '#1e293b';
      ctx.font = 'bold 11px Pretendard';
      ctx.textAlign = 'center';
      ctx.fillText(senderName.value, hx + hw / 2 + 5, hy + 19);

      // 말풍선 순차 등장 로직
      // prog(0.0~1.0)를 구간으로 쪼개어 나타나게 함. 0.7 이후에는 완성형 대화 유지
      const total = chatBubbles.length;
      let visibleCount = Math.floor(prog / (0.7 / total)) + 1;
      if (visibleCount > total) visibleCount = total;

      let currentY = it.y + 58;

      chatBubbles.forEach((bubble, idx) => {
        const isLeft = bubble.side === 'left';
        const bw = Math.min(185, it.w - 40);
        const bh = 34;
        const bx = isLeft ? (it.x + 14) : (it.x + it.w - bw - 14);

        if (idx < visibleCount) {
          // 이미 나타난 말풍선 (테두리 라인 없음)
          drawRoundRect(ctx, bx, currentY, bw, bh, 12);
          if (isLeft) {
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.fillStyle = '#334155';
            ctx.font = 'bold 9.5px Pretendard';
            ctx.textAlign = 'left';
            ctx.fillText(bubble.text.length > 15 ? bubble.text.slice(0, 15) + '...' : bubble.text, bx + 10, currentY + 21);
          } else {
            ctx.fillStyle = themeColor;
            ctx.fill();
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 9.5px Pretendard';
            ctx.textAlign = 'left';
            ctx.fillText(bubble.text.length > 15 ? bubble.text.slice(0, 15) + '...' : bubble.text, bx + 10, currentY + 21);
          }
        } else if (idx === visibleCount && prog < 0.7) {
          // 현재 타이핑 중인 '...' 인디케이터 말풍선
          const tw = 48, th = 28;
          const tx = isLeft ? (it.x + 14) : (it.x + it.w - tw - 14);
          drawRoundRect(ctx, tx, currentY + 3, tw, th, 14);
          ctx.fillStyle = isLeft ? '#ffffff' : themeColor;
          ctx.fill();

          // 퐁퐁 튀는 점 3개
          for (let d = 0; d < 3; d++) {
            const bounce = Math.sin((prog * 12 + d * 0.4) * Math.PI) * 2;
            ctx.beginPath();
            ctx.arc(tx + 14 + d * 10, currentY + 17 + bounce, 2, 0, Math.PI * 2);
            ctx.fillStyle = isLeft ? '#64748b' : '#0f172a';
            ctx.fill();
          }
        }
        currentY += 42;
      });

      // 하단 입력바
      const ix = it.x + 14, iy = it.y + it.h - 38, iw = it.w - 28, ih = 26;
      drawRoundRect(ctx, ix, iy, iw, ih, 13);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.fillStyle = '#94a3b8';
      ctx.font = '11px sans-serif';
      ctx.fillText('+', ix + 10, iy + 17);
      ctx.font = '9px Pretendard';
      ctx.fillText('메시지 보내기...', ix + 26, iy + 17);
      ctx.fillText('📷', ix + iw - 18, iy + 17);

      ctx.restore();
    }

    // 미니 뮤직 플레이어
    function renderFloatingMusicPlayer(prog) {
      const it = elements.player;

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
      ctx.shadowBlur = 24;
      ctx.shadowOffsetY = 10;

      drawRoundRect(ctx, it.x, it.y, it.w, it.h, 16);
      ctx.fillStyle = 'rgba(15, 17, 24, 0.92)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 1;
      ctx.stroke();

      drawRoundRect(ctx, it.x + 12, it.y + 12, 38, 38, 8);
      ctx.fillStyle = '#334155';
      ctx.fill();
      if (bgImg) {
        ctx.save();
        drawRoundRect(ctx, it.x + 12, it.y + 12, 38, 38, 8);
        ctx.clip();
        ctx.drawImage(bgImg, it.x + 12, it.y + 12, 38, 38);
        ctx.restore();
      }

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px Pretendard';
      ctx.textAlign = 'left';
      ctx.fillText(songTitle.value.length > 12 ? songTitle.value.slice(0, 12) + '..' : songTitle.value, it.x + 58, it.y + 26);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '9.5px Pretendard';
      ctx.fillText(artistName.value.length > 14 ? artistName.value.slice(0, 14) + '..' : artistName.value, it.x + 58, it.y + 42);

      ctx.fillStyle = '#e2e8f0';
      ctx.font = '9px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⏮', it.x + 80, it.y + 64);
      ctx.fillText('▶', it.x + 110, it.y + 64);
      ctx.fillText('⏭', it.x + 140, it.y + 64);

      const bx = it.x + 12, by = it.y + 74, bw = it.w - 24;
      ctx.beginPath();
      ctx.moveTo(bx, by); ctx.lineTo(bx + bw, by);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.stroke();

      const curW = bw * (0.3 + prog * 0.4);
      ctx.beginPath();
      ctx.moveTo(bx, by); ctx.lineTo(bx + curW, by);
      ctx.strokeStyle = themeColor;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(bx + curW, by, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.restore();
    }

    // 아이폰 목업 (요청: 시계 상단/중단/하단 전환 반영)
    function renderIPhone16(prog) {
      const it = elements.phone;

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
      ctx.shadowBlur = 28;
      ctx.shadowOffsetX = 8;
      ctx.shadowOffsetY = 15;

      drawRoundRect(ctx, it.x, it.y, it.w, it.h, 36);
      ctx.fillStyle = '#090a0f';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#2d3345';
      ctx.stroke();
      ctx.restore();

      ctx.save();
      drawRoundRect(ctx, it.x + 5, it.y + 5, it.w - 10, it.h - 10, 32);
      ctx.clip();

      const targetImg = phoneImg || bgImg;
      if (targetImg) {
        const s = Math.max((it.w - 10) / targetImg.width, (it.h - 10) / targetImg.height);
        const iw = targetImg.width * s, ih = targetImg.height * s;
        ctx.drawImage(targetImg, it.x + 5 + (it.w - 10 - iw) / 2, it.y + 5 + (it.h - 10 - ih) / 2, iw, ih);
        ctx.fillStyle = 'rgba(10, 12, 18, 0.25)';
        ctx.fillRect(it.x + 5, it.y + 5, it.w - 10, it.h - 10);
      } else {
        ctx.fillStyle = '#1e1b4b';
        ctx.fillRect(it.x + 5, it.y + 5, it.w - 10, it.h - 10);
      }

      // 다이내믹 아일랜드
      roundRect(ctx, it.x + it.w / 2 - 32, it.y + 14, 64, 16, 8);
      ctx.fillStyle = '#000000';
      ctx.fill();

      // 시계 (상단 / 중단 / 하단 동적 Y 좌표)
      let clockY = it.y + 92;
      if (phoneClockPos === 'middle') clockY = it.y + 220;
      if (phoneClockPos === 'bottom') clockY = it.y + 360;

      const colon = prog < 0.5 ? ':' : ' ';
      const timeVal = phoneTime.value.includes(':') ? phoneTime.value.replace(':', colon) : phoneTime.value;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 34px Pretendard';
      ctx.textAlign = 'center';
      ctx.fillText(timeVal, it.x + it.w / 2, clockY);

      // 하단 플레이어 미니 바 (시계가 하단일 때는 숨김 처리하여 겹침 방지)
      if (phoneClockPos !== 'bottom') {
        const ipX = it.x + 14, ipY = it.y + it.h - 60, ipW = it.w - 28, ipH = 38;
        drawRoundRect(ctx, ipX, ipY, ipW, ipH, 12);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 9.5px Pretendard';
        ctx.textAlign = 'left';
        ctx.fillText(songTitle.value.length > 11 ? songTitle.value.slice(0, 11) + '..' : songTitle.value, ipX + 10, ipY + 18);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '8px Pretendard';
        ctx.fillText(artistName.value.length > 13 ? artistName.value.slice(0, 13) + '..' : artistName.value, ipX + 10, ipY + 30);

        ctx.fillStyle = '#ffffff';
        ctx.font = '10px sans-serif';
        ctx.fillText('▶', ipX + ipW - 18, ipY + 23);
      }

      ctx.restore();
    }

    // 15fps 실시간 프리뷰 루프
    draw(0);
    setInterval(() => {
      animProgress = (animProgress + 0.04) % 1;
      draw(animProgress);
    }, 100);

    // ================= 고화질 내보내기 (GIF & MP4) =================
    const btnGenerateGIF = document.getElementById('btnGenerateGIF');
    const btnGenerateMP4 = document.getElementById('btnGenerateMP4');
    const loadingStatus = document.getElementById('loadingStatus');
    const progressBar = document.getElementById('progressBar');
    const statusMsg = document.getElementById('statusMsg');
    const resultArea = document.getElementById('resultArea');
    const previewMediaWrapper = document.getElementById('previewMediaWrapper');
    const btnDownload = document.getElementById('btnDownload');
    const btnShareX = document.getElementById('btnShareX');

    // 1. 고화질 GIF 내보내기 (14프레임 매끄러운 타이핑)
    btnGenerateGIF.addEventListener('click', () => {
      btnGenerateGIF.disabled = true;
      btnGenerateMP4.disabled = true;
      loadingStatus.classList.remove('hidden');
      resultArea.classList.add('hidden');
      progressBar.style.width = '15%';
      statusMsg.textContent = '타이핑 프레임 캡처 중...';

      const frames = [];
      const totalFrames = 14;
      for (let i = 0; i < totalFrames; i++) {
        draw(i / totalFrames);
        frames.push(canvas.toDataURL('image/png'));
      }

      progressBar.style.width = '45%';
      statusMsg.textContent = '색상 최적화 GIF 인코딩 중...';

      gifshot.createGIF({
        images: frames,
        gifWidth: 960,
        gifHeight: 540,
        interval: 0.12,
        sampleInterval: 2,
        numWorkers: 2
      }, function(obj) {
        btnGenerateGIF.disabled = false;
        btnGenerateMP4.disabled = false;
        loadingStatus.classList.add('hidden');

        if (!obj.error) {
          previewMediaWrapper.innerHTML = `<img src="${obj.image}" class="w-full h-full object-cover">`;
          btnDownload.href = obj.image;
          btnDownload.download = `aesthetic_pair_16x9.gif`;
          resultArea.classList.remove('hidden');
          resultArea.scrollIntoView({ behavior: 'smooth' });
        } else {
          alert('GIF 생성 실패: 다시 시도해주세요.');
        }
      });
    });

    // 2. 무손실 초고화질 MP4 내보내기
    btnGenerateMP4.addEventListener('click', () => {
      btnGenerateGIF.disabled = true;
      btnGenerateMP4.disabled = true;
      loadingStatus.classList.remove('hidden');
      resultArea.classList.add('hidden');
      progressBar.style.width = '20%';
      statusMsg.textContent = '무손실 60fps 비디오 녹화 중...';

      const stream = canvas.captureStream(60);
      let mimeType = 'video/mp4';
      if (!MediaRecorder.isTypeSupported('video/mp4')) {
        if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
          mimeType = 'video/webm;codecs=vp9';
        } else if (MediaRecorder.isTypeSupported('video/webm')) {
          mimeType = 'video/webm';
        } else {
          mimeType = '';
        }
      }

      let recorder;
      try {
        recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      } catch (e) {
        recorder = new MediaRecorder(stream);
      }

      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: recorder.mimeType || 'video/mp4' });
        const videoUrl = URL.createObjectURL(blob);

        previewMediaWrapper.innerHTML = `<video src="${videoUrl}" autoplay loop muted playsinline class="w-full h-full object-cover"></video>`;
        btnDownload.href = videoUrl;
        btnDownload.download = `aesthetic_pair_16x9.mp4`;

        btnGenerateGIF.disabled = false;
        btnGenerateMP4.disabled = false;
        loadingStatus.classList.add('hidden');
        resultArea.classList.remove('hidden');
        resultArea.scrollIntoView({ behavior: 'smooth' });
      };

      recorder.start();

      let currentFrame = 0;
      const totalSteps = 50;
      const interval = setInterval(() => {
        draw(currentFrame / totalSteps);
        currentFrame++;
        progressBar.style.width = `${Math.min(90, Math.round((currentFrame / totalSteps) * 100))}%`;

        if (currentFrame >= totalSteps) {
          clearInterval(interval);
          recorder.stop();
        }
      }, 33);
    });

    // 트위터 공유
    btnShareX.addEventListener('click', () => {
      const url = window.location.href;
      const text = encodeURIComponent(`16:9 와이드 감성 페어틀 메이커 ✨\n#움짤페어틀 #페어틀 #자캐 #드림 #도파\n`);
      window.open(`https://twitter.com/intent/tweet?text=${text}&url=${encodeURIComponent(url)}`, '_blank');
    });
  </script>
</body>
